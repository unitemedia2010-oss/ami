name: Deploy lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cần đúng 3 quyền này để xuất bản Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Cho phép chạy nhiều lần; job mới sẽ huỷ job cũ đang chờ
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cài thư viện
        working-directory: web
        run: npm ci

      # ⚠ RAM: GitHub Actions có 7 GB. next.config.mjs đã đặt
      #   experimental.cpus = 2 để tránh chạm trần RAM khi sinh trang.
      #   Nếu job bị "process out of memory", hãy thêm NODE_OPTIONS ở bước build.
      - name: Build
        working-directory: web
        env:
          # Trang là "project site" của GitHub nên nằm trong thư mục con /ami.
          # Thiếu biến này: HTML mở được nhưng mọi file _next/*.js trả 404.
          # Đặt thành rỗng khi đã gắn tên miền riêng cho Pages.
          NEXT_PUBLIC_BASE_PATH: /ami
          # Để TRỐNG = chế độ dữ liệu tĩnh: trang đọc thẳng web/public/data.
          # Đặt URL Worker/Supabase khi đã nối máy chủ thật.
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://unitemedia2010-oss.github.io/ami
        run: npm run build

      - name: Kiểm tra bản build
        # Phòng ngừa những lỗi KHÔNG báo lỗi build mà chỉ lộ ra khi deploy:
        #   • dữ liệu tĩnh bị .gitignore loài mất → trang trắng
        #   • thiếu file cấu hình .json → "Can't resolve '@/components/ui'"
        #   • quên tiền tố /ami → HTML mở được nhưng mọi ảnh 404
        #   • địa chỉ chi tiết lọt ra trang công khai
        #
        # ⚠ Về `address_line`: cột này CỐ Ý xuất hiện trong mã trang quản
        #   trị (/admin/…/tao) vì đó là ô nhập liệu của môi giới. Nên ta
        #   chỉ kiểm tra phần CÔNG KHAI, không kiểm tra cả thư mục admin.
        #   Bản đầu tiên quét toàn bộ → deploy đỏ oan, phải sửa lại.
        run: |
          set -e
          # ⚠ Đổi danh sách file ở đây phải khớp với tools/build_27k.mjs.
          #   Dữ liệu đã chia nhỏ theo quận: 1 file gộp nặng 2,4 MB nén,
          #   chia 23 file thì mỗi lần chỉ tải file của khu vực đang xem.
          for f in web/tsconfig.json web/package-lock.json \
                   web/public/data/index.json web/public/data/districts.json; do
            [ -f "$f" ] || { echo "::error::Thiếu $f — kiểm tra .gitignore"; exit 1; }
          done
          n=$(ls web/public/data/d/*.json 2>/dev/null | wc -l)
          if [ "$n" -lt 20 ]; then
            echo "::error::Chỉ có $n file dữ liệu theo quận (cần ≥20) — .gitignore có chặn không?"
            exit 1
          fi
          if ! grep -q 'paths' web/tsconfig.json; then
            echo "::error::web/tsconfig.json thiếu khai báo alias @/"
            exit 1
          fi
          if ! grep -q '/ami/_next' web/out/index.html; then
            echo "::error::Thiếu tiền tố /ami trong HTML — kiểm tra NEXT_PUBLIC_BASE_PATH"
            exit 1
          fi
          if grep -rn "address_line" web/out/_next/static/chunks/app \
                       --include="*.js" --exclude-dir=admin; then
            echo "::error::Cột PII address_line lọt vào mã trang CÔNG KHAI — DỪNG lại"
            exit 1
          fi
          if grep -l "address_line" web/public/data/index.json web/public/data/d/*.json 2>/dev/null; then
            echo "::error::Dữ liệu tĩnh ship ra công khai chứa address_line — DỪNG lại"
            exit 1
          fi
          echo "OK: cấu hình, $n file dữ liệu theo quận, tiền tố /ami, không lộ cột PII"

      - name: Soát giao diện
        # Ba lỗi đã xảy ra thật, đều KHÔNG làm build hỏng:
        #   • class `bg-white/12` nằm ngoài thang opacity → Tailwind bỏ âm thầm,
        #     nền biến mất mà không ai biết
        #   • chip nền kính tối quên `text-white` → chữ đen trên nền đen
        #   • regex bỏ dấu tiếng Việt bị hỏng → tìm "go vap" không ra "Gò Vấp"
        run: |
          node tools/check_tailwind_classes.mjs
          node tools/check_contrast_classes.mjs
          # Tự kiểm chứng chính script trên bằng các ca lỗi CỐ Ý, để lần
          # nới điều kiện lọc sau này không âm thầm làm script hỏng.
          node tools/check_contrast_probe.mjs
          # React key trùng chỉ ghi ra console, build vẫn xanh — đã xảy ra
          # thật ở footer (3 mục cùng trỏ /tim-kiem/?type=rent với key={href}).
          node tools/check_duplicate_keys.mjs
          node tools/check_duplicate_keys_probe.mjs
          # Chấm bản đồ hòa vào nền OSM là lỗi thị giác, build không báo.
          # Kiểm bằng cách đọc chuỗi SVG trong map.ts, không cần trình duyệt.
          node tools/check_marker_icons.mjs
          # <a href="/…"> và href trong popup Leaflet KHÔNG được Next gắn
          # basePath — thiếu /ami là 404 "Site not found" khi người dùng bấm.
          # <Link> thì Next tự gắn nên không tính.
          node tools/check_raw_paths.mjs
          # Script soát chạy được trên Windows nhưng chết trên Linux khi
          # cắt tiền tố bằng replace(cwd + '\\'). Script này mô phỏng đường dẫn
          # kiểu CI để chặn đúng lỗi đó — đã làm deploy đỏ một lần.
          node tools/check_posix_paths.mjs
          node tools/check_bundle_fold.mjs

      - name: Soát dữ liệu
        # districts.ts khai báo slug cho generateStaticParams của /quan/[slug].
        # Trước đây viết tay nên lệch với districts.json: thiếu quan-2, quan-9,
        # binh-thanh, nha-be (→ 404 vĩnh viễn trên static export) và có 6 slug
        # không tồn tại. Nay file .ts do build_27k.mjs sinh ra; script này
        # chặn trường hợp ai sửa tay làm hai file lệch nhau lần nữa.
        run: |
          node tools/check_districts_sync.mjs
          node tools/check_map_data.mjs
          # `?project=` mang MÃ dự án (prj-x40) nhưng tin đăng chỉ lưu TÊN.
          # Trước đây so thẳng mã với tên nên không tin nào khớp, và vì điều
          # kiện lọc không loại tin nào, trang hiện TOÀN BỘ 27.659 tin — tưởng
          # bộ lọc hỏng. Script này chạy lại đúng thuật toán lọc trên dữ
          # liệu thật và so số tin ra với con số popup hiện trên bản đồ.
          node tools/check_project_filter.mjs
          # Thẻ dự án từng hiện "N toà" — thông tin của chủ đầu tư, không
          # phải thứ người đọc trang tin đăng cần, và chỉ 64/441 dự án có.
          node tools/check_project_card_label.mjs
          # Bang so sanh truoc day chi co dong chu nho "Bo khoi so sanh" —
          # nguoi dung bao khong thay cach xoa. Nay co nut X tron tren anh.
          node tools/check_compare_remove.mjs
          node tools/check_compare_remove_probe.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4