<style>
  :root{ --bg:#0A2340; --coral:#F2A488; --gold:#E0A93F; --green:#58B98A; --cream:#E9E4D5; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);
    font-family:"Segoe UI",system-ui,Arial,sans-serif;color:#D8E2EE}
  #stage{position:fixed;inset:0;cursor:grab;touch-action:none}
  #stage.drag{cursor:grabbing}
  svg{width:100%;height:100%;display:block}
  #bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;
    align-items:flex-start;padding:16px 20px;pointer-events:none;gap:12px}
  #bar .box{pointer-events:auto;background:rgba(6,18,33,.88);backdrop-filter:blur(10px);
    border:1px solid rgba(224,169,63,.35);border-radius:14px;padding:12px 16px;box-shadow:0 10px 34px rgba(0,0,0,.55)}
  h1{margin:0;font-family:Georgia,serif;font-weight:700;font-size:clamp(20px,2.4vw,29px);
    letter-spacing:.24em;color:var(--cream);padding-left:.24em}
  .sub{margin-top:4px;font-size:10.5px;letter-spacing:.28em;color:#C0B088;text-transform:uppercase}
  .loc{margin-top:6px;font-size:12px;color:#9FB4C8}.loc b{color:var(--gold);font-weight:600}
  #legend{display:flex;flex-direction:column;gap:7px;min-width:186px;cursor:pointer}
  #legend .row{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#C6D4E2;padding:3px 5px;
    border-radius:8px;transition:.2s}
  #legend .row:hover{background:rgba(255,255,255,.08)}
  #legend .row.off{opacity:.3;text-decoration:line-through}
  #legend .dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 9px 2px currentColor;flex:0 0 auto}
  #legend .cap{font-size:10px;letter-spacing:.3em;color:#7F93A8;border-bottom:1px solid rgba(255,255,255,.12);
    padding-bottom:6px;margin-bottom:2px}
  #foot{position:fixed;left:20px;bottom:16px;z-index:5;font-size:11px;color:rgba(200,215,230,.5);pointer-events:none}
  #zoom{position:fixed;right:20px;bottom:16px;z-index:5;display:flex;gap:8px}
  #zoom button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(224,169,63,.4);
    background:rgba(6,18,33,.85);color:var(--gold);font-size:17px;cursor:pointer;transition:.2s}
  #zoom button:hover{background:rgba(224,169,63,.25);transform:translateY(-2px)}
  #tip{position:fixed;z-index:9;pointer-events:none;opacity:0;transform:translate(-50%,-150%);
    background:rgba(4,12,22,.96);border:1px solid currentColor;border-radius:10px;padding:6px 11px;
    font-size:12px;white-space:nowrap;transition:opacity .15s;box-shadow:0 6px 24px rgba(0,0,0,.65)}
  #tip .c{margin-top:2px;font-size:10px;letter-spacing:.16em;opacity:.75;text-transform:uppercase}

  .pulse{animation:pl 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pl{0%{opacity:.45;transform:scale(.75)}100%{opacity:0;transform:scale(1.8)}}
  .poi{cursor:pointer}.poi:hover .lbl{fill:#fff}

  .lbl{font-size:9.5px;font-weight:600;fill:#CBD9E7;paint-order:stroke;stroke:#07182C;
    stroke-width:3.2px;stroke-linejoin:round}
  .lbl.air{font-size:10.5px;fill:#DCE9F5;stroke-width:3.6px}
  .lbl.rd{font-size:12.5px;font-weight:700;fill:#F3F7FB;stroke-width:3.6px;letter-spacing:.05em}
  .lbl.dt{font-size:16px;font-weight:700;fill:#C0B088;letter-spacing:.2em;stroke-width:4.5px;opacity:.9}
  .lbl.lm{font-size:17px;font-weight:600;fill:#93AE90;letter-spacing:.08em;stroke-width:4.5px;opacity:.85}
  .lbl.mt{font-size:12px;font-weight:700;fill:#E0A93F;letter-spacing:.05em;stroke-width:3.6px}
  .lbl.hw{font-size:11.5px;font-weight:700;fill:#58B98A;letter-spacing:.05em;stroke-width:3.6px}
  .lbl.br{font-size:9px;fill:#A9C4DA;stroke-width:3px}
  .lbl.ga{font-size:8.5px;fill:#DCE9F5;stroke-width:2.8px}
  .lbl.ttl{font-family:Georgia,serif;font-size:32px;font-weight:700;letter-spacing:8px;fill:#F1EBDB;stroke-width:4px}
</style>

<script>
const CAT = {
  school:{label:"Trường học",color:"#D4659C"}, hospital:{label:"Bệnh viện / Y tế",color:"#E7657F"},
  shop:{label:"Mua sắm",color:"#DCAC50"}, golf:{label:"Sân Golf",color:"#93A3B0"},
  airport:{label:"Sân bay quốc tế",color:"#7FA8CC"}, park:{label:"Công viên",color:"#6FBF9A"}
};

/* tên | loại | lng | lat | vị trí nhãn: r / l / b */
const POI = [
  ["SB Quốc tế Tân Sơn Nhất","airport",106.6520,10.8180,"b"],
  ["SB Quốc tế Long Thành","airport",106.8100,10.8700,"b"],

  ["Trường QT AIS","school",106.7600,10.8260,"r"],
  ["Trường QT BIS","school",106.7570,10.8255,"l"],
  ["Trường THPT Thủ Thiêm","school",106.7000,10.7560,"l"],
  ["TH College","school",106.7350,10.7800,"l"],
  ["KĐT Thủ Thiêm","school",106.6980,10.7750,"r"],
  ["Khu vui chơi Snow Town","school",106.7420,10.7820,"r"],
  ["Gem Sky World","school",106.7900,10.8200,"r"],
  ["Trường QT Việt Nam","school",106.7450,10.7720,"r"],
  ["HV Hàng không VN","school",106.8000,10.8300,"r"],

  ["BV Đức Bà","hospital",106.6870,10.7810,"l"],
  ["BV Quốc tế Mỹ (Anh)","hospital",106.7060,10.7790,"r"],
  ["BV Hoàn Mỹ Thủ Đức","hospital",106.7300,10.7900,"l"],
  ["BV Đa khoa Nam Thủ Đức","hospital",106.7260,10.7820,"l"],
  ["TT Y tế TP Thủ Đức","hospital",106.7550,10.8150,"l"],
  ["BV Lê Văn Thịnh","hospital",106.7380,10.7950,"r"],
  ["TT Y tế Rạch Chiếc","hospital",106.7480,10.8040,"l"],
  ["PKĐK An Phú","hospital",106.6960,10.7560,"r"],

  ["Mega Mall Thủ Thiêm","shop",106.7020,10.7660,"r"],
  ["MM Mega Market","shop",106.7100,10.7840,"r"],
  ["Vincom Mega Mall","shop",106.7040,10.7630,"l"],
  ["ESTELLA PLACE","shop",106.7290,10.7770,"r"],
  ["GIGAMALL Thủ Đức","shop",106.7040,10.8090,"l"],
  ["THISO MALL SALA","shop",106.7090,10.7450,"r"],
  ["The Global City","shop",106.7280,10.8030,"l"],
  ["TTTM Rạch Chiếc","shop",106.7550,10.7960,"r"],

  ["Sân Golf Rạch Chiếc","golf",106.7220,10.7860,"l"],
  ["Sân Golf Thủ Đức","golf",106.8080,10.8560,"r"],

  ["CV ven sông Thủ Thiêm","park",106.6900,10.7620,"l"],
  ["CV Nhơn Trạch","park",106.8250,10.7520,"r"]
];

const CX=1100, CY=720, LON0=106.750, LAT0=10.810, K=6300;
const X=lng=>CX+(lng-LON0)*K, Y=lat=>CY-(lat-LAT0)*K;

const ICON={
  school:'<path d="M-7,-2 L0,-6 L7,-2 L0,2 Z" fill="#0A2340"/><path d="M-4,0 v4 c0,2 8,2 8,0 V0" fill="#0A2340"/>',
  hospital:'<path d="M-1.6,-6 h3.2 v4.4 H6 v3.2 H1.6 V6 h-3.2 V1.6 H-6 v-3.2 h4.4 Z" fill="#0A2340"/>',
  shop:'<path d="M-6,-3 h12 l-1.2,9 h-9.6 Z" fill="#0A2340"/><path d="M-3,-3 a3,3 0 0 1 6,0" fill="none" stroke="#0A2340" stroke-width="1.4"/>',
  golf:'<path d="M-4,7 v-13 l9,2.5 l-9,2.6" fill="#0A2340"/><circle cx="-4" cy="7.4" r="1.6" fill="#0A2340"/>',
  airport:'<path d="M0,-9 c1.5,0 2.1,1.7 2.1,4.2 v3.1 l8.4,5.2 v2.1 l-8.4,-2.1 v4.2 l2.6,1.7 v1.7 L0,10.6 l-4.7,1.7 v-1.7 l2.6,-1.7 v-4.2 l-8.4,2.1 v-2.1 l8.4,-5.2 v-3.1 c0,-2.5 .6,-4.2 2.1,-4.2 Z" fill="#0A2340"/>',
  park:'<path d="M0,-6 c4,3 6,6 6,8 a6,6 0 0 1 -12,0 c0,-2 2,-5 6,-8 Z" fill="#0A2340"/>'
};

/* ---- tự giãn nhãn để tránh chồng chữ ---- */
const nodes = POI.map(([name,cat,lng,lat,side]) => ({
  name, cat, side, x:X(lng), y:Y(lat), oy:0,
  w:(cat==="airport"?name.length*5.6:name.length*4.9)+10
}));
for(let it=0; it<260; it++){
  for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i], b=nodes[j];
    const ax = a.side==="l" ? a.x-a.w : a.side==="b" ? a.x-a.w/2 : a.x;
    const bx = b.side==="l" ? b.x-b.w : b.side==="b" ? b.x-b.w/2 : b.x;
    if((ax+a.w > bx+4) && (bx+b.w > ax+4) && Math.abs(a.oy-b.oy) < 16){
      const d = a.oy <= b.oy ? -1 : 1;
      a.oy += d; b.oy -= d;
    }
  }
}
nodes.forEach(n => { n.oy = Math.max(-150, Math.min(150, n.oy)); });

/* vòng 2: dọn theo cột — các nhãn cùng dải ngang bị đẩy nhau */
for(let it=0; it<120; it++){
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i], b=nodes[j];
      if(Math.abs(a.x-b.x) > 130) continue;
      const gap = Math.abs(a.oy-b.oy);
      if(gap < 15){
        const d = a.oy <= b.oy ? -1 : 1;
        a.oy += d*0.8; b.oy -= d*0.8;
      }
    }
  }
}
nodes.forEach(n => { n.oy = Math.max(-150, Math.min(150, n.oy)); });

const poisG=document.getElementById("pois"), tip=document.getElementById("tip");
nodes.forEach(n => {
  const c = CAT[n.cat].color;
  const g=document.createElementNS("http://www.w3.org/2000/svg","g");
  g.setAttribute("class","poi"); g.dataset.cat=n.cat;
  g.setAttribute("transform",`translate(${n.x.toFixed(1)},${(n.y+n.oy).toFixed(1)})`);
  const dx = n.side==="l" ? -14 : n.side==="b" ? 0 : 14;
  const ty = n.side==="b" ? 22 : 3.5;
  const anchor = n.side==="l" ? "end" : n.side==="b" ? "middle" : "start";
  g.innerHTML =
    `<line x1="${n.side==="l"?8:n.side==="b"?0:-8}" y1="0" x2="${dx*0.72}" y2="0"
       stroke="${c}" stroke-width="1" opacity=".45"/>` +
    `<circle r="14" fill="${c}" opacity=".14"/><circle class="hit" r="8.5" fill="${c}"/>` +
    `<g transform="translate(0,-10) scale(.6)">${ICON[n.cat]}</g>` +
    `<text class="lbl${n.cat==="airport"?" air":""}" x="${dx}" y="${ty}" text-anchor="${anchor}">${n.name}</text>`;
  g.addEventListener("mouseenter", ev=>{
    tip.querySelector(".t").textContent=n.name; tip.querySelector(".c").textContent=CAT[n.cat].label;
    tip.style.color=c; tip.style.opacity=1; g.querySelector(".hit").setAttribute("r","10.5");
  });
  g.addEventListener("mousemove", ev=>{ tip.style.left=ev.clientX+"px"; tip.style.top=ev.clientY+"px"; });
  g.addEventListener("mouseleave", ()=>{ tip.style.opacity=0; g.querySelector(".hit").setAttribute("r","8.5"); });
  poisG.appendChild(g);
});

const legend=document.getElementById("legend");
Object.entries(CAT).forEach(([k,v])=>{
  const row=document.createElement("div"); row.className="row";
  row.innerHTML=`<span class="dot" style="background:${v.color};color:${v.color}"></span>${v.label}`;
  row.onclick=()=>{ const off=row.classList.toggle("off");
    document.querySelectorAll(`.poi[data-cat="${k}"]`).forEach(p=>p.style.display=off?"none":""); };
  legend.appendChild(row);
});

/* PAN / ZOOM */
const svg=document.getElementById("map");
const FULL={x:0,y:0,w:2000,h:1400};          // toàn cảnh
const HOME={x:470,y:270,w:1180,h:826};        // mặc định: zoom vùng dự án
let vb={...HOME}, dragging=false, sx=0, sy=0, ox=0, oy=0;
function apply(){ svg.setAttribute("viewBox",`${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}`); }
function zoomAt(f,cx,cy){ const nw=Math.min(2600,Math.max(340,vb.w*f)), k=nw/vb.w;
  vb.x=cx-(cx-vb.x)*k; vb.y=cy-(cy-vb.y)*k; vb.w=nw; vb.h*=k; apply(); }
function zoomCenter(f){ const r=svg.getBoundingClientRect(), k=vb.w/r.width;
  zoomAt(f, vb.x+(r.width/2)*k, vb.y+(r.height/2)*k); }
const stage=document.getElementById("stage");
stage.addEventListener("wheel",e=>{ e.preventDefault();
  const r=svg.getBoundingClientRect(), k=vb.w/r.width;
  zoomAt(e.deltaY>0?1.14:1/1.14, vb.x+(e.clientX-r.left)*k, vb.y+(e.clientY-r.top)*k); },{passive:false});
stage.addEventListener("pointerdown",e=>{ dragging=true; stage.classList.add("drag");
  sx=e.clientX; sy=e.clientY; ox=vb.x; oy=vb.y; stage.setPointerCapture(e.pointerId); });
stage.addEventListener("pointermove",e=>{ if(!dragging) return;
  const r=svg.getBoundingClientRect(), k=vb.w/r.width;
  vb.x=ox-(e.clientX-sx)*k; vb.y=oy-(e.clientY-sy)*k; apply(); });
["pointerup","pointercancel"].forEach(ev=>stage.addEventListener(ev,()=>{ dragging=false; stage.classList.remove("drag"); }));
document.getElementById("zin").onclick=()=>zoomCenter(1/1.3);
document.getElementById("zout").onclick=()=>zoomCenter(1.3);
document.getElementById("reset").onclick=()=>{ vb={...HOME}; apply(); };
document.addEventListener("keydown",e=>{
  if(e.key==="0"){ vb={...HOME}; apply(); }
  if(e.key==="9"){ vb={...FULL}; apply(); }
  if(e.key==="+"||e.key==="=") zoomCenter(1/1.3);
  if(e.key==="-") zoomCenter(1.3);
});
apply();   // áp khung nhìn mặc định (zoom vùng dự án)
</script>
